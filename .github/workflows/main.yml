name: deploy-main-to-gcp.yml

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Decodes the base64-encoded private key securely, avoiding newline/formatting corruptions
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | base64 -d > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          ssh-keyscan -H 34.162.84.165 >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy over SSH
        shell: bash
        env:
          SSH_USER: isabella_orear31
          SSH_HOST: 34.162.84.165
          APP_DIR: app
          PM2_NAME: fullstack-booknook
        run: |
          ssh -i ~/.ssh/id_rsa -T "$SSH_USER@$SSH_HOST" <<EOF
            set -e

            cd "$APP_DIR"

            git pull origin main
            cd server && npm install
            pm2 restart "$PM2_NAME" || pm2 start app.js --name "$PM2_NAME"
            pm2 save
          EOF
