name: deploy-main-to-gcp.yml
 
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          # safer than StrictHostKeyChecking=no
          # ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts
          ssh-keyscan -H 34.162.84.165 >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
      - name: Deploy over SSH
        shell: bash
        env:
          SSH_USER: isabella_orear31 #${{ secrets.SSH_USER }}
          SSH_HOST: 34.162.84.165 #${{ secrets.SSH_HOST }}
          APP_DIR:  app # ${{ vars.APP_DIR }}
          PM2_NAME: fullstack-booknook # ${{ vars.PM2_NAME }}
        run: |
          ssh -i ~/.ssh/id_rsa -T "$SSH_USER@$SSH_HOST" <<EOF
            set -e
            cd "$APP_DIR"
            git pull origin main
            cd server && npm install
            pm2 restart "$PM2_NAME" || pm2 start app.js --name "$PM2_NAME"
            pm2 save
          EOF
